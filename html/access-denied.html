<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | Highland Fresh</title>
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-base-200">
    <main class="min-h-screen flex items-center justify-center p-6">
        <section class="w-full max-w-lg rounded-xl border border-base-300 bg-base-100 shadow-xl overflow-hidden">
            <div class="bg-error/10 px-6 py-5">
                <div class="flex items-start gap-4">
                    <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-error text-error-content">
                        <i class="fas fa-shield-halved"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold uppercase tracking-[0.16em] text-error">Access denied</p>
                        <h1 class="mt-1 text-2xl font-bold text-base-content">This page is not for your role</h1>
                        <p class="mt-2 text-sm text-base-content/70">You are signed in, but your account is not allowed to open the page you typed.</p>
                    </div>
                </div>
            </div>

            <div class="space-y-4 p-6">
                <div class="rounded-lg border border-base-300 bg-base-200/60 p-4">
                    <p class="text-xs font-semibold uppercase tracking-wider text-base-content/50">Blocked page</p>
                    <p class="mt-1 break-all text-sm font-medium text-base-content" id="blockedPage">-</p>
                </div>

                <div class="rounded-lg bg-base-200/70 p-3 text-sm text-base-content/70">
                    <i class="fas fa-circle-info mr-1 text-primary"></i>
                    Please use the dashboard assigned to your account. Ask the General Manager if your role is incorrect.
                </div>
            </div>

            <div class="flex flex-col-reverse gap-2 border-t border-base-300 bg-base-100 px-6 py-4 sm:flex-row sm:justify-end">
                <button type="button" class="btn btn-ghost" onclick="AuthService.logout()">Log out</button>
                <button type="button" class="btn btn-primary" id="goDashboardBtn">
                    <i class="fas fa-arrow-left mr-2"></i>Back to My Dashboard
                </button>
            </div>
        </section>
    </main>

    <script src="../js/vendor/axios.min.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/config/auth.js?v=20260814-3"></script>
    <script>
        if (!AuthService.requireAuth()) {
            document.body.style.display = 'none';
        }

        const params = new URLSearchParams(window.location.search);
        const from = params.get('from') || sessionStorage.getItem('highland_denied_from') || 'Unknown page';
        document.getElementById('blockedPage').textContent = from;

        document.getElementById('goDashboardBtn').addEventListener('click', () => {
            const user = AuthService.getCurrentUser();
            AuthService.redirectToRoleDashboard(user?.role);
        });
    </script>
</body>
</html>
