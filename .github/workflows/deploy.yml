name: Deploy Highland Fresh to GoogieHost

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: highland-fresh-googiehost-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: FTP deploy to GoogieHost
        id: deploy_primary
        continue-on-error: true
        uses: SamKirkland/ftp-deploy-action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          # The deploy-only FTP account is rooted at
          # /domains/highlandfresh.whf.bz/public_html already.
          server-dir: ./
          # Do NOT delete server files that aren't in the repo (protects .env, etc.)
          dangerous-clean-slate: false
          # Never upload development files, database exports, backups, or secrets.
          exclude: |
            .git/**
            .github/**
            .claude/**
            .vscode/**
            tests/**
            docs/**
            cron/**
            config/**
            backups/**
            tmp/**
            storage/logs/**
            uploads/**
            .playwright-mcp/**
            system_context/**
            **/node_modules/**
            /vendor/**
            **/*.sql
            **/*.log
            **/.DS_Store
            **/Thumbs.db
            setup.php
            test_evidence.jpg
            highland_fresh_azure.sql
            package.json
            package-lock.json
            tailwind.config.js
            tailwind.config.json
            web.config
            .gitignore
            .env*
            css/input.css
            temp_schema.txt
            api/config/DigiCertGlobalRootCA.crt.pem

      - name: Wait before retrying a busy shared FTP host
        if: steps.deploy_primary.outcome == 'failure'
        shell: bash
        run: sleep 45

      - name: Retry FTP deploy to GoogieHost
        if: steps.deploy_primary.outcome == 'failure'
        uses: SamKirkland/ftp-deploy-action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            .git/**
            .github/**
            .claude/**
            .vscode/**
            tests/**
            docs/**
            cron/**
            config/**
            backups/**
            tmp/**
            storage/logs/**
            uploads/**
            .playwright-mcp/**
            system_context/**
            **/node_modules/**
            /vendor/**
            **/*.sql
            **/*.log
            **/.DS_Store
            **/Thumbs.db
            .idea/**
            package.json
            package-lock.json
            composer.json
            composer.lock
            tailwind.config.js
            tailwind.config.json
            web.config
            .gitignore
            .env*
            css/input.css
            temp_schema.txt
            api/config/DigiCertGlobalRootCA.crt.pem
            html/production/_autologin.html
            *.zip
            *.tar.gz
            server_dot_env.txt
            highland_fresh_no_triggers.sql
            HighlandFreshAppV4_deploy*
            C:/Users/**
